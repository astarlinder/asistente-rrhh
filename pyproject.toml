[project]
name = "asistente-rrhh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "fastapi>=0.162.0",
    "fpdf2>=2.9.0",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

  [tool.pytest.ini_options]
  pythonpath = ["."]
  testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true